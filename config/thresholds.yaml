# ============================================================================
# EVERY numeric constant in the pipeline lives here, and EVERY entry needs a
# `source:` field. src/config.py::load_thresholds() raises on a missing one
# (invariant I6, acceptance test T5).
#
# `source:` must be one of:
#   derived:<module>   — computed at runtime by that module, written back here
#   cited:<reference>  — a published convention, named
#   decision:<doc §>   — a human decision recorded in a document
# A value may be null with a TODO. A value may NOT be a number without a source.
#
# Attempt 2 lost on exactly this: sensible constants, never justified.
# ============================================================================

classification:

  tau_escalation:
    value: null
    source: "derived:src.validate.sweep_tau"
    todo: >
      Plot pass-1 accuracy against the gold set bucketed by self-reported
      confidence. Set tau at the bucket where accuracy first drops below the
      corpus mean. Do not default to 0.7.

  batch_size_B:
    value: 20
    source: "derived:src.classify.sweep_batch_size_by_agreement"
    note: >
      Derived 22 Aug 2026 on n=60 utterances with gemini-3.5-flash-lite at
      temperature 0.

      METHOD. The gold-based accuracy sweep in 04 §4.3 needs valid hand labels,
      which did not exist at run time, so B was derived from label STABILITY -
      the specific thing a large batch threatens, via attention dilution. The
      smallest B is run TWICE to establish the model's own run-to-run
      nondeterminism floor (98.3% agreement); temperature 0 constrains sampling
      but does not make a large model bit-exact. A larger B is only disqualified
      if it disagrees MORE than that floor.

      RESULT. Every B in {5,10,20,40} was indistinguishable from the floor with
      zero omissions: B=10 93.3% (p=0.17), B=20 96.7% (p=0.56), B=40 93.3%
      (p=0.17).

      TIE-BREAK. 04 §4.3 says take the largest, because "throughput rises
      monotonically with B". That only discriminates when throughput binds. Over
      14,379 utterances against a 1,000 request/day budget, B=5 needs 2,876
      calls and B=10 needs 1,438 - neither fits - while B=20 (719) and B=40 (360)
      both do. Once a B fits inside one day, a larger one buys nothing, so the
      tie-break is blast radius: a failed, deferred or quarantined batch costs B
      utterances, making the smaller fitting batch strictly cheaper to recover
      from. Hence 20, not 40.

      CAVEAT. n=60 gives limited power - this is no evidence of harm, not
      evidence of no harm. It also measures stability rather than accuracy: a
      model consistently wrong the same way at every B would pass. The
      gold-based sweep remains owed and takes precedence once valid hand labels
      exist.

  batch_size_B_sweep_grid:
    value: [5, 10, 20, 40]
    source: "decision:04_scraper_requirements.md §4.3"

  temperature:
    value: 0
    source: "decision:04_scraper_requirements.md §4.4 — a classifier with temperature is not reproducible"

validation:

  kappa_acceptance_floor:
    value: 0.61
    source: "cited:Landis & Koch (1977) Biometrics 33(1):159-174 — lower bound of the 'substantial agreement' band (0.61-0.80)"

  kappa_acceptance_ceiling_note:
    value: 0.80
    source: "cited:Landis & Koch (1977) — upper bound of 'substantial'; values above are 'almost perfect'"

  human_sample_size_n:
    value: null
    source: "derived:src.validate.derive_sample_size"
    todo: >
      Derive AFTER S5: n large enough that the Wilson interval on the smallest
      area you intend to report is narrower than the smallest differential you
      intend to claim. Three lines of arithmetic; they go in the appendix.

  disagreement_stratum_oversample_factor:
    value: null
    source: "derived:src.validate.derive_sample_size"
    todo: "Set with n. Reweight to population before computing kappa, or kappa understates agreement."

  lane_c_sample_target_per_day:
    value: 340
    source: "derived:measured against the live Groq API, 22 Aug 2026"
    note: >
      04 §4.1 estimated ~1,300 utterances/day from a ~160 tokens-per-utterance
      assumption. Measured, gpt-oss-120b emits ~396 OUTPUT tokens per utterance
      because it reasons before answering - output exceeds input on this task.

      At B=10 a call costs ~5,860 tokens for 10 utterances (586/utterance), so
      the 200,000 TPD cap allows ~341. B is capped at 10 by the 8,000 TPM
      ceiling: B=20 would need ~10,320 tokens, more than a whole minute's budget
      in a single call.

      gpt-oss-120b was retained after testing the alternatives: gpt-oss-20b and
      qwen3.6-27b both fail JSON generation on this schema, so it is the only
      Groq model that can do the job - the spec's choice, now measured rather
      than assumed.

  lane_c_batch_size:
    value: 10
    source: "derived:Groq 8,000 TPM ceiling measured 22 Aug 2026"
    note: >
      Separate from classification.batch_size_B, which governs lane A on Gemini.
      Lane C is bounded by a different constraint: 1,400 preamble + ~446 tokens
      per utterance must stay under 8,000 TPM, giving B <= 14. Ten is chosen over
      fourteen for headroom, since exceeding TPM costs the entire minute.

statistics:

  alpha:
    value: 0.05
    source: "cited:conventional two-sided significance level"

  proportion_ci_method:
    value: "wilson"
    source: "cited:Brown, Cai & DasGupta (2001) Statistical Science 16(2) — Wilson interval preferred over Wald at small n and extreme p"

  min_cell_n_for_reporting:
    value: null
    source: "derived:src.quantify.derive_min_cell"
    todo: "Smallest denominator whose Wilson interval is narrower than the smallest claimed differential. Below it, report the count and suppress the rate."

collection:

  posted_at_null_rate_trend_cutoff:
    value: null
    source: "derived:src.normalise.report_null_rates"
    todo: >
      Set from OBSERVED per-source posted_at null rates after S2. Above this
      rate a source may not support a trend claim. Do not pick a round number
      before observing.

  near_dup_similarity:
    value: 1.0
    source: "decision:04_scraper_requirements.md §2.8 — exact sha1(normalised_text) match only; fuzzy near-dup thresholds are taste and are not used"

  near_dup_min_words:
    value: 10
    source: "derived:src.filter.derive_near_dup_floor"
    note: >
      Word floor below which identical text is treated as COINCIDENCE rather
      than duplication. Derived from the observed collision distribution over
      79,199 utterances on 22 Aug 2026: collisions fall steeply with length
      (20.4% of corpus at >=2 words, 2.3% at >=4, 0.20% at >=6, 0.043% at >=8)
      and then PLATEAU at 23 collisions from 10 words onward. The plateau is the
      signal: below it, identical text is thousands of people independently
      writing "good" or "nice app"; at and above it, the count is stable, which
      is what genuine duplication looks like.
      Without this floor the near-dup rule fired 31,278 times and 98.1% of those
      were <=4 words - reporting the corpus as half-duplicated when it is really
      half one-to-four-word generic praise. The denominator was unaffected
      (those rows fail too_short regardless), but the drop log is an appendix
      output and the attribution has to be true.

  short_review_word_floor:
    value: 8
    source: "decision:04_scraper_requirements.md §3 — reviews under ~8 words emit as a single utterance, not split"

  min_tokens_after_stopwords:
    value: 3
    source: "decision:04_scraper_requirements.md §3 S4 — too_short drop rule"

  spam_repeat_source_ids:
    value: 5
    source: "decision:04_scraper_requirements.md §3 S4 — text repeated across >5 source_ids is boilerplate"
